[project]
name = "relic-extract"
version = "0.1.0"
description = "Step 2 of scan -> extract -> embed: relic-scan month files -> per-stream, deduped, chunked parts for embedding"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyarrow>=17"]

[project.scripts]
relic-extract = "relic_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic_extract"]
