[package]
name = "relic-extract"
version = "26.10.23-alpha.1344"
edition = "2024"
rust-version = "1.89"
description = "Step 2 of scan -> extract -> embed: relic-scan month files -> per-stream, deduped, chunked parts for embedding"
repository = "https://github.com/Soul-Brews-Studio/relic-extract"

[dependencies]
arrow = { version = "60.0.0", default-features = false }
blake2b_simd = "1.0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.10"
serde = "1.0.229"
regex = "1.13.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 4
