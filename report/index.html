<script>/*I18N*/</script>
<script>
(() => {
  const b = document.getElementById("theme"), order = ["auto", "dark", "light"];
  let t = localStorage.getItem("relic-report-theme") || "auto";
  const set = () => {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    b.textContent = window.t ? window.t("theme", { v: window.t("theme." + t) }) : t;
  };
  set();
  b.onclick = () => { t = order[(order.indexOf(t) + 1) % 3]; localStorage.setItem("relic-report-theme", t); set(); };
})();
</script>
